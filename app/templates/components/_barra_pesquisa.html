<form class="barra-pesquisa barra-pesquisa--header"
      action="{{ url_for('pesquisa.pesquisa_dinamica') }}"
      method="GET">

  <div class="barra-pesquisa__grupo">
    <input 
      type="search"
      name="item"
      id="busca-input"
      placeholder="Buscar..."
      required
    >

    <button type="submit" class="btn-lupa">
      <i class="ri-search-line"></i>
    </button>

    <button type="button" class="btn-filtro">
      <i class="ri-equalizer-line"></i>
    </button>
  </div>

  <div id="resultado-busca"></div>

  {% include 'components/_painel_filtros.html' %}

</form>
