<div id="overlay" class="escondido"></div>

<div id="painel-filtros" class="escondido">
  <h3>Filtros</h3>
  
  <div class="filtro-grupo">
    <label>Preço (R$) </label>
    <div class="precos">
      <input type="number" name="preco_min" placeholder="De">
      <input type="number" name="preco_max" placeholder="Até">
    </div>
  </div>
  <div class="filtro-grupo">
    <label>Categoria</label>
    
    <div class="categorias">
      <button type="button" class="opcao-filtro"> Todos </button>
      <button type="button" class="opcao-filtro"> Brincos </button>
      <button type="button" class="opcao-filtro"> Colares </button>
      <button type="button" class="opcao-filtro"> Outros </button>
    </div>
    
  </div>
  <div class="acoes">
    <button type="button" class="acoes-btn">
      <i class="ri-delete-bin-7-line"></i>
      Limpar filtro
    </button>
    <button type="submit" class="acoes-btn">
      <i class="ri-check-line"></i>
      Aplicar filtros
    </button>
  </div>
  
</div>
