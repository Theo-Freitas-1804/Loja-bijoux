{% extends "base.html" %}

{% block conteudo %}
<div id="produtos">
  <form method="POST" enctype="multipart/form-data" id="ficha-produto">
    <h2>Adicionar novo acessório</h2>

    <!-- Upload -->
    <div class="campo">
      <label for="foto">Fotos</label>
      <input type="file" id="foto-acessorio" name="foto-acessorio" multiple>
    </div>

  <!-- Infos -->
  <fieldset>
    <legend>Informações da peça</legend>

    <div class="campo">
      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome-bijuteria" required>
    </div>

    <div class="campo">
      <label for="colecao">Coleção</label>
      <input type="text" id="colecao" name="colecao">
    </div>

    <div class="campo">
      <label for="tamanho">Tamanho</label>
      <input type="text" id="tamanho" name="tamanho">
    </div>

    <div class="campo">
      <label for="material">Material</label>
      <input type="text" id="material" name="material">
    </div>

    <div class="campo">
      <label for="preco">Preço</label>
      <input type="number" id="preco" name="preco" step="0.01">
    </div>

    <div class="campo">
      <label for="estoque">Estoque</label>
      <input type="number" id="qtd" name="qtd">
    </div>
  </fieldset>

  <!-- Categoria (tipo de cadastro) -->
  <fieldset>
    <legend> Tipo de cadastro</legend>

    <label><input type="radio" name="categoria" value="colecao"> Capa</label>
    <label><input type="radio" name="categoria" value="bijuteria"> Bijuteria</label>
  </fieldset>
  
  <!-- Tipo de bijuteria -->
  
  <fieldset id="campo-categoria">
    <legend>Categoria da bijuteria</legend>
    <select name="categoria_produto">
      <option value="colar">
          Colar
      </option>
  
      <option value="brinco">
          Brinco
      </option>
  
      <option value="broche">
          Broche
      </option>
  
      <option value="pulseira">
          Pulseira
      </option>
  
      <option value="anel">
          Anel
      </option>
  
    </select>
  </fieldset>
  
  <!-- Preview -->
  <div id="preview-container">
    <h3>Itens na fila</h3>
    <ul id="lista-preview"></ul>
  </div>

  <!-- Ações -->
  <div class="acoes">
    <button type="button" id="adicionar-a-fila">Adicionar à fila</button>
    <button type="button" id="btn-enviar">Cadastrar</button>
  </div>

  </form>
</div>
    
{% endblock %}
{% block scripts%}
  <script src="{{ url_for('static', filename='Js/novo_produto.js') }}"></script>
{% endblock %}
