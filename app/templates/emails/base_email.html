<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <title>{% block titulo %}{% endblock %}</title>
</head>
<body style="margin:0;background:#f5f5f5;font-family:Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:16px;overflow:hidden;">
          <!-- Cabeçalho -->
          <tr>
            <td align="center"style="padding:32px;background:#faf8f6;">
              <img src="cid:{{ logo_id }}" width="60" height="60" style="border-radius:50%;">
              <h1 style="margin:0;color:#f59e0b;font-size:34px;">
                Kordonê Bijoux
              </h1>
              <p style="color:#777;margin-top:8px;">
                Elegância em cada detalhe
              </p>
            </td>
          </tr>
          <!-- Conteúdo -->
          <tr>
            <td style="padding:40px;">
              {% block conteudo %}
              {% endblock %}
            </td>
          </tr>
          <!-- Rodapé -->
          <tr>
            <td align="center" style="padding:24px;background:#faf8f6;color:#777;font-size:13px;">
              <p>
                © Kordonê Bijoux
              </p>
              <p>
                Este é um e-mail automático.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
